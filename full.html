<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hemostatic seal rig — full system</title>
<style>
:root{--bg:#f6f6f6;--ink:#1E2A36;--muted:#5A6B7B;--line:#34495E;--panel:#c7c7c7;--accent:#A4161A;}
*{box-sizing:border-box}
body{margin:0;padding:18px 20px;background:var(--bg);color:var(--ink);font-family:"Segoe UI","Helvetica Neue",Arial,sans-serif}
h1{font-size:18px;font-weight:600;margin:0 0 4px;letter-spacing:.2px}
.sub{font-size:13px;color:var(--muted);margin:0 0 12px}
#wrap{position:relative;width:100%;height:calc(100vh - 200px);min-height:420px;touch-action:none;cursor:grab;overflow:hidden;background:#252525;border:1px solid #CBD3DB;border-radius:6px}
#c{width:100%;height:100%;display:block}
#labels{position:absolute;inset:0;pointer-events:none}
.lbl{position:absolute;left:0;top:0;font-size:11.5px;white-space:nowrap;padding:2px 7px;border-radius:3px;background:var(--panel);border:1px solid var(--line);color:var(--ink);transform:translate(-50%,-100%);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.lbl.below{transform:translate(-50%,0)}
.bar{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px;align-items:center}
.bar span.t{font-size:12px;color:var(--muted);margin-right:4px;text-transform:uppercase;letter-spacing:.6px}
button{font:inherit;font-size:13px;padding:6px 12px;border-radius:4px;border:1px solid #9AA8B5;background:#fff;color:var(--ink);cursor:pointer}
button:hover{background:#E3E8ED}
button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
button:focus-visible{outline:2px solid #2E6F95;outline-offset:2px}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px;font-size:12px;color:var(--muted)}
.sw{display:inline-block;width:11px;height:11px;border-radius:2px;margin-right:6px;vertical-align:-1px;border:1px solid rgba(0,0,0,.15)}
#state{font-size:13px;margin-top:8px;color:var(--ink)}
</style>
</head>
<body>
<h1>Hemostatic seal rig — full system</h1>
<p class="sub">Closed-loop blood simulant circuit with bypass around the wound branches, four wound sites and instrumentation.</p>
<div id="wrap"><canvas id="c"></canvas><div id="labels"></div></div>
<div class="bar">
<span class="t">Mode</span>
<button class="md" data-m="-1">Idle (bypass only)</button><button class="md" data-m="0">Run branch 1</button><button class="md" data-m="1">Run branch 2</button><button class="md" data-m="2">Run branch 3</button><button class="md" data-m="3">Run branch 4</button>
</div>
<div class="bar">
<span class="t">View</span>
<button id="bLab">Hide labels</button><button id="bEnc">Hide enclosure</button><button id="bFlow">Pause flow</button><button id="bReset">Reset view</button>
</div>
<div id="state"></div>
<div class="legend">
<span><span class="sw" style="background:#F1FAEE"></span>Hardware</span>
<span><span class="sw" style="background:#457B9D"></span>Instruments</span>
<span><span class="sw" style="background:#A8DADC"></span>Tissue analog</span>
<span><span class="sw" style="background:#387f4b"></span>Gel</span>
<span><span class="sw" style="background:#E63946"></span>Active flow</span>
<span><span class="sw" style="background:#C9D1D9"></span>Closed line</span>
<span>Drag to rotate · scroll to zoom</span>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
const wrap=document.getElementById('wrap'),canvas=document.getElementById('c'),labelsEl=document.getElementById('labels');
const C={plate:0x424547,hw:0xF1FAEE,inst:0x457B9D,tissue:0xA8DADC,gel:0x387F4B,blood:0xE63946,idle:0xC9D1D9,edge:0x34495E,glass:0x9CC3D5};
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(38,1,0.1,100);
scene.add(new THREE.AmbientLight(0xffffff,0.7));
const dl=new THREE.DirectionalLight(0xffffff,0.6);dl.position.set(6,11,8);scene.add(dl);
const labels=[];
function label(text,x,y,z,below){const d=document.createElement('div');d.className='lbl'+(below?' below':'');d.textContent=text;labelsEl.appendChild(d);labels.push({el:d,p:new THREE.Vector3(x,y,z)});return labels.length-1;}
function box(w,h,d,color,x,y,z,op,name){const g=new THREE.BoxGeometry(w,h,d);const m=new THREE.Mesh(g,new THREE.MeshLambertMaterial({color,transparent:op<1,opacity:op,depthWrite:op>=1}));m.position.set(x,y,z);scene.add(m);const e=new THREE.LineSegments(new THREE.EdgesGeometry(g),new THREE.LineBasicMaterial({color:C.edge,transparent:true,opacity:0.6}));e.position.copy(m.position);scene.add(e);if(name)label(name,x,y+h/2+0.2,z);return [m,e];}
function seg(pts){const p=new THREE.CurvePath();for(let i=0;i<pts.length-1;i++)p.add(new THREE.LineCurve3(new THREE.Vector3(...pts[i]),new THREE.Vector3(...pts[i+1])));return p;}
function tube(pts,color,op,r){const m=new THREE.Mesh(new THREE.TubeGeometry(seg(pts),Math.max(24,pts.length*40),r||0.06,10,false),new THREE.MeshLambertMaterial({color,transparent:true,opacity:op}));scene.add(m);return m;}

box(12,0.2,8.4,C.plate,0,-0.1,-0.45,1);
box(1.2,1.4,1,C.hw,-4.5,0.7,-2,1,'Reservoir bag');
box(1.2,0.9,1,C.hw,-2.5,0.45,-2,1,'Pump');
box(0.6,0.6,0.6,C.hw,-1.2,0.3,-2,1,'Emergency shutoff');
box(1,0.8,0.8,C.hw,0.6,0.4,-2,1,'Tourniquet pinch valve');
box(1.2,0.7,0.8,C.inst,2.6,0.35,-2,1,'Flow meter 1 + pressure P1');
box(0.6,0.5,0.5,C.hw,-3.1,0.25,-3.3,1);label('Pressure relief',-3.1,0,-3.3,true);
box(0.5,0.5,0.5,C.hw,2.6,0.25,-0.9,1,'Bypass valve (NO)');
box(0.5,0.4,0.4,C.hw,1.5,0.2,-0.9,1);
box(0.5,0.5,3.2,C.hw,4.4,0.25,1.5,1,'Branch selector');
box(0.5,0.5,3.2,C.hw,1.0,0.25,1.5,1,'Merge + check valves');
label('Needle valve',1.5,0.15,-0.9,true);
const Z=[0.3,1.1,1.9,2.7];const GEL=['none','pre','pre','live'];
Z.forEach((z,i)=>{box(1.0,0.5,0.5,C.tissue,2.7,0.25,z,1);
const w=new THREE.Mesh(new THREE.SphereGeometry(0.07,12,12),new THREE.MeshLambertMaterial({color:C.blood}));w.position.set(2.7,0.5,z);scene.add(w);
if(GEL[i]!=='none'){const g=new THREE.Mesh(new THREE.SphereGeometry(0.16,20,20),new THREE.MeshLambertMaterial({color:C.gel}));g.scale.set(1,0.5,1);g.position.set(2.7,0.5,z);scene.add(g);}
if(GEL[i]==='live'){const s=new THREE.Mesh(new THREE.CylinderGeometry(0.06,0.06,0.9,12),new THREE.MeshLambertMaterial({color:C.hw}));s.position.set(2.7,1.05,z);scene.add(s);}});
label('No gel (control)',2.7,0.75,0.3);
label('Live-applied gel (syringe)',2.7,1.65,2.7);
box(2.4,1.6,3.3,C.glass,2.7,0.8,1.5,0.1);
label('Sealed wound cell',3.9,1.75,3.15);
box(0.5,0.4,0.5,C.inst,2.7,2.4,1.5,1,'Camera (top)');
box(0.5,0.5,0.3,C.inst,2.7,0.6,3.45,1,'Camera (side)');
box(1.2,0.7,0.8,C.inst,-0.4,0.35,1.5,1,'Flow meter 2');
box(1,0.5,0.6,C.hw,-2.5,0.25,1.5,1,'Restrictor');
box(1.4,0.5,1,C.inst,-4.5,0.25,2.6,1,'DAQ + accelerometer');
const enc=box(12.4,3.8,8.8,C.glass,0,1.9,-0.45,0.035);
const encL=label('Outer containment',-4.8,3.9,-4.7);
const Y=0.3, TA=3.8, TB=0.4, ZB=-0.9;
tube([[-4.5,Y,-2],[TA,Y,-2]],C.blood,0.6);
const toSel=tube([[TA,Y,-2],[4.4,Y,-2],[4.4,Y,-0.1]],C.idle,0.55);
const byT=tube([[TA,Y,-2],[TA,Y,ZB],[TB,Y,ZB],[TB,Y,1.5]],C.blood,0.6);
const fromMerge=tube([[1.0,Y,1.5],[TB,Y,1.5]],C.idle,0.55);
tube([[TB,Y,1.5],[-3.6,Y,1.5],[-3.6,Y,-1.2],[-4.5,Y,-1.2],[-4.5,Y,-1.6]],C.blood,0.6);
tube([[-0.35,Y,-2],[-0.35,Y,-3.3],[-4.5,Y,-3.3],[-4.5,Y,-2.5]],C.idle,0.5);
const bt=Z.map(z=>tube([[4.4,Y,z],[1.0,Y,z]],C.idle,0.5));

const ret=[[TB,Y,1.5],[-3.6,Y,1.5],[-3.6,Y,-1.2],[-4.5,Y,-1.2],[-4.5,Y,-1.6]];
const idlePath=seg([[-4.5,Y,-2],[TA,Y,-2],[TA,Y,ZB],[TB,Y,ZB],...ret]);
let runPath=null;
const N=34,pm=new THREE.MeshLambertMaterial({color:C.blood}),parts=[];
for(let i=0;i<N;i++){const s=new THREE.Mesh(new THREE.SphereGeometry(0.075,10,10),pm);scene.add(s);parts.push(s);}
const stateEl=document.getElementById('state');
let mode=-1;
const names=['branch 1 (no gel)','branch 2 (pre-applied gel)','branch 3 (pre-applied gel)','branch 4 (live-applied gel)'];
function setMode(m){mode=m;const run=m>=0;
[toSel,fromMerge].forEach(t=>{t.material.color.setHex(run?C.blood:C.idle);t.material.opacity=run?0.6:0.5;});
byT.material.color.setHex(run?C.idle:C.blood);byT.material.opacity=run?0.45:0.6;
bt.forEach((t,j)=>{t.material.color.setHex(j===m?C.blood:C.idle);t.material.opacity=j===m?0.6:0.45;});
if(run){const z=Z[m];runPath=seg([[-4.5,Y,-2],[4.4,Y,-2],[4.4,Y,z],[1.0,Y,z],[1.0,Y,1.5],...ret]);}
stateEl.textContent=run?('Run: '+names[m]+' open, bypass valve closed. Flow meter 1 minus flow meter 2 gives the wound leak.'):'Idle: all branch solenoids closed, bypass open. Flow passes both flow meters and returns to the reservoir. Pressure relief stays shut unless the tourniquet is closed.';
document.querySelectorAll('.md').forEach(b=>b.classList.toggle('on',+b.dataset.m===m));}
document.querySelectorAll('.md').forEach(b=>b.onclick=()=>setMode(+b.dataset.m));
setMode(-1);
const target=new THREE.Vector3(0,0.6,0);let th=0.65,ph=1.0,rad=16.5;
function setCam(){camera.position.set(target.x+rad*Math.sin(ph)*Math.sin(th),target.y+rad*Math.cos(ph),target.z+rad*Math.sin(ph)*Math.cos(th));camera.lookAt(target);}
let W=1,H=1;function resize(){W=wrap.clientWidth;H=wrap.clientHeight;renderer.setSize(W,H,false);camera.aspect=W/H;camera.updateProjectionMatrix();}
new ResizeObserver(resize).observe(wrap);resize();setCam();
let drag=false,lx=0,ly=0;
wrap.addEventListener('pointerdown',e=>{drag=true;lx=e.clientX;ly=e.clientY;wrap.style.cursor='grabbing';wrap.setPointerCapture(e.pointerId);});
wrap.addEventListener('pointermove',e=>{if(!drag)return;th-=(e.clientX-lx)*0.008;ph=Math.min(1.45,Math.max(0.15,ph-(e.clientY-ly)*0.008));lx=e.clientX;ly=e.clientY;setCam();});
wrap.addEventListener('pointerup',()=>{drag=false;wrap.style.cursor='grab';});
wrap.addEventListener('wheel',e=>{e.preventDefault();rad=Math.min(28,Math.max(7,rad*(1+e.deltaY*0.001)));setCam();},{passive:false});
let showLab=true,flowing=true,t=0;
document.getElementById('bLab').onclick=function(){showLab=!showLab;labelsEl.style.display=showLab?'block':'none';this.textContent=showLab?'Hide labels':'Show labels';};
document.getElementById('bEnc').onclick=function(){const v=!enc[0].visible;enc.forEach(o=>o.visible=v);labels[encL].el.style.visibility=v?'visible':'hidden';this.textContent=v?'Hide enclosure':'Show enclosure';};
document.getElementById('bFlow').onclick=function(){flowing=!flowing;this.textContent=flowing?'Pause flow':'Resume flow';};
document.getElementById('bReset').onclick=()=>{th=0.65;ph=1.0;rad=16.5;setCam();};
const v=new THREE.Vector3();
function loop(){if(flowing)t=(t+0.0012)%1;const p=mode>=0?runPath:idlePath;
parts.forEach((s,i)=>s.position.copy(p.getPointAt((t+i/N)%1)));
renderer.render(scene,camera);
if(showLab)labels.forEach(l=>{v.copy(l.p).project(camera);if(v.z>1){l.el.style.display='none';return;}l.el.style.display='block';l.el.style.left=((v.x+1)/2*W)+'px';l.el.style.top=((1-v.y)/2*H)+'px';});
requestAnimationFrame(loop);}
loop();
})();
</script>
</body>
</html>
