<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Team Stasis</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&family=Source+Sans+3:wght@400;600&display=swap">
<style>
/* Layout: one centred column. Name at the top, two model cards below. */
:root{
  --bg:#f6f7f9; --surface:#ffffff; --fg:#141a22; --muted:#5a6676; --line:#d9dee6;
  --accent:#0c249c; --accent-ink:#ffffff;
  --display:'Archivo', 'Helvetica Neue', Arial, sans-serif;
  --body:'Source Sans 3', 'Segoe UI', Arial, sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0f1319; --surface:#171d26; --fg:#eef1f5; --muted:#9aa6b6; --line:#2a333f;
  --accent:#4068e0; --accent-ink:#0f1319; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0f1319; --surface:#171d26; --fg:#eef1f5; --muted:#9aa6b6; --line:#2a333f;
  --accent:#4068e0; --accent-ink:#0f1319; color-scheme:dark }

body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:17px;line-height:1.5;
  padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px));padding-block:0}
.wrap{max-width:720px;margin:0 auto;padding-block:64px;display:flex;flex-direction:column;gap:36px}
h1{font-family:var(--display);font-weight:800;font-size:clamp(36px,7vw,56px);line-height:1;margin:0;letter-spacing:-0.02em}
.models{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:14px;min-width:0}
.card h2{font-family:var(--display);font-weight:700;font-size:20px;margin:0}
.btn{display:inline-flex;align-items:center;gap:8px;align-self:flex-start;background:var(--accent);color:var(--accent-ink);text-decoration:none;font-weight:600;padding:10px 16px;border-radius:9px;font-size:15px}
.btn:hover{filter:brightness(1.08)}
.btn:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.btn svg{width:16px;height:16px}
@media (prefers-reduced-motion:no-preference){.btn{transition:filter .15s}}
</style>

<div class="wrap">
  <h1>Team Stasis</h1>
  <div class="models">
    <article class="card">
      <h2>System Overview</h2>
      <a class="btn" href="full.html" target="_blank" rel="noopener">Open model
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M6 3H3v10h10v-3M9 3h4v4M13 3 7 9"/></svg></a>
    </article>
    <article class="card">
      <h2>Wound Sites Compartment</h2>
      <a class="btn" href="zoom.html" target="_blank" rel="noopener">Open model
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M6 3H3v10h10v-3M9 3h4v4M13 3 7 9"/></svg></a>
    </article>
  </div>
</div>
</body>
</html>
